# 태그 vX.Y.Z push(main 의 커밋만) → Windows app-image zip + MSI → CHANGELOG 생성 → GitHub Release
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write

jobs:
  verify-main:
    name: 태그가 main 위에 있는지 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          sha="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          # 단순 조상 검사는 이미 main 에 들어간 과거 dev 커밋도 통과시키므로 first-parent 사슬로 확인
          git rev-list --first-parent origin/main | grep -qx "$sha" || {
            echo "::error::태그 $GITHUB_REF_NAME 가 main 의 릴리스 커밋(first-parent)이 아닙니다. dev → main 릴리스 PR 병합 후 main 끝에서 태그하세요."
            exit 1
          }

  package-windows:
    needs: verify-main
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 버전 = 태그
        shell: pwsh
        run: echo "TANAGER_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV
      - name: 전체 검사
        shell: pwsh
        run: ./gradlew check -PexcludeTags=wsl
      - uses: ./.github/actions/setup-wix
      - name: jpackage (app-image → zip, MSI)
        shell: pwsh
        # PowerShell 은 '-' 로 시작하는 따옴표 없는 인수의 $env: 를 펼치지 않는다 → 따옴표 필수.
        # 외부 명령의 종료 코드로는 멈추지 않으므로 $LASTEXITCODE 를 직접 본다.
        run: |
          ./gradlew :bootstrap:jpackageImage :bootstrap:verifyAppImage :bootstrap:jpackageInstaller "-Pversion=$env:TANAGER_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # zip · MSI 이름 맞추기는 CI package-smoke 와 같은 스크립트(PR 에서 검증된다). 프리릴리스는 MSI 를 붙이지 않는다
          $pre = $env:TANAGER_VERSION.Contains('-')
          ./.github/scripts/collect-dist.ps1 -Version "$env:TANAGER_VERSION" -SkipMsi:$pre
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            Tanager-*-windows-x64.zip
            Tanager-*-windows-x64.msi
          if-no-files-found: error

  publish:
    needs: package-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - name: CHANGELOG 생성 (Conventional Commits, 영어 노트가 없을 때 대신 씀)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          # 배포 문서는 영어(#115): 릴리스 PR 에서 쓴 docs/releases/<태그>.md 가 있으면 그것을 노트로 쓴다
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [[ -f "$notes" ]] || notes=RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" $pre \
            --title "Tanager $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            $(find dist -type f \( -name '*.zip' -o -name '*.msi' \))
