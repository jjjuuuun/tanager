# 순서: gate → lint → (test-core ∥ test-windows) → package-smoke(app-image · MSI — PR 과 push 모두)
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"   # 최신 LTS. 다음 LTS(29) 전까지 고정
  JAVA_DISTRIBUTION: temurin

jobs:
  # M1(Gradle 래퍼) 전에는 아래 잡을 실패 대신 '건너뜀'으로 둔다. 건너뛴 잡은 필수 검사에서 통과로 친다.
  gate:
    name: 0. gate (gradlew 있음?)
    runs-on: ubuntu-latest
    outputs:
      has_gradle: ${{ steps.check.outputs.has_gradle }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [[ ! -f gradlew ]]; then
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"; echo "::notice::gradlew 없음(M1 전) — Gradle 잡을 건너뜁니다"
          elif [[ ! -x gradlew ]]; then
            # 건너뜀은 필수 검사에서 '통과'로 치므로, 실행 비트 누락을 조용히 넘기면 테스트 없이 초록불이 된다
            echo "::error::gradlew 가 실행 권한 없이(100644) 커밋됐습니다. 'git update-index --chmod=+x gradlew' 후 다시 커밋하세요."
            exit 1
          else
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: 1. lint (spotless)
    needs: gate
    if: needs.gate.outputs.has_gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck

  test-core:
    name: 2a. test core (domain · app · ArchUnit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :domain:check :application:check :architecture:test jacocoCoverageVerification
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: "**/build/reports/"

  test-windows:
    name: 2b. test windows (ConPTY · PowerShell · 통합)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # WSL 은 GitHub 호스티드 러너에서 쓸 수 없으므로 @Tag("wsl") 테스트는 제외한다
      - run: ./gradlew check -PexcludeTags=wsl
        shell: pwsh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: "**/build/reports/"

  # macOS 지원(M7) 시작 시 주석 해제
  # test-macos:
  #   name: 2c. test macos
  #   needs: lint
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-java@v5
  #       with: { distribution: temurin, java-version: "25" }
  #     - uses: gradle/actions/setup-gradle@v4
  #     - run: ./gradlew check

  # 빌드 · 패키징 변경을 병합 전에 잡으려고 PR 에서도 돈다(약 몇 분 더 걸리는 비용은 감수, #22)
  package-smoke:
    name: 3. package smoke (jpackage app-image · MSI)
    needs: [test-core, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-wix
      # app-image → 고지(LICENSE · THIRD-PARTY-NOTICES · D2Coding OFL)와 글꼴 검사(ADR-0010) → MSI
      - run: ./gradlew :bootstrap:jpackageImage :bootstrap:verifyAppImage :bootstrap:jpackageInstaller
        shell: pwsh
      # 시작 시간 · AOT 캐시(#221): MSI 를 풀어 두 번 띄워 2번째에 캐시를 쓰는지 본다. 캐시 없음 · 데스크톱 없음은 경고만
      - name: AOT 캐시 확인(MSI 를 푼 이미지)
        shell: pwsh
        run: ./.github/scripts/check-startup-cache.ps1
      # release 와 같은 배포 파일 모으기 스크립트를 PR 에서 미리 돌려 본다(#22)
      - name: 배포 파일 모으기 확인(release 와 같은 스크립트)
        shell: pwsh
        run: |
          ./.github/scripts/collect-dist.ps1 -Version "0.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in @("Tanager-0.0.0-windows-x64.zip", "Tanager-0.0.0-windows-x64.msi")) {
            if (-not (Test-Path -LiteralPath $f)) { Write-Error "없음: $f"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tanager-windows-app-image
          path: app/bootstrap/build/jpackage/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tanager-windows-msi
          path: app/bootstrap/build/jpackage-installer/*.msi
          if-no-files-found: error
          retention-days: 7
