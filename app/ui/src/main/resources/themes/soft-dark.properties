# Tanager 소프트 다크 — 색의 유일한 원본(SDD §8.5, ADR-0006 · ADR-0010).
# SoftDarkLaf 가 FlatLaf.properties · FlatDarkLaf.properties 다음에 합친다(UTF-8 로 읽음).
# 값을 바꾸면 SoftThemeTokensTest 의 대비 검사가 함께 돈다.

# ① 토큰 12개
@window = #1B1E26
@sidebar = #181B23
@term = #1B1E26
@header = #15181F
@border = #262A35
@text = #D6DAE3
@muted = #9AA1AF
@accent = #7AA2F7
@select = #252A36
@ok = #7FD1A8
@warn = #E6C07B
@bad = #F2A7A7

# ① 터미널 팔레트(배경 = @term)
@termFg = #D6DAE3
@termCursor = #C8D3F5
@termSelect = #2D3650
@ansi0 = #2A2F3B
@ansi1 = #E08A8A
@ansi2 = #8CC6A0
@ansi3 = #D9BC7E
@ansi4 = #7AA2F7
@ansi5 = #BB9AE0
@ansi6 = #7FC4CC
@ansi7 = #B4BAC6
@ansi8 = #6E7686
@ansi9 = #F2A7A7
@ansi10 = #B8E6C6
@ansi11 = #E9D09A
@ansi12 = #A3BEF9
@ansi13 = #D3B9F0
@ansi14 = #A2D8DE
@ansi15 = #DDE1E8

# ② FlatLaf 기반 변수(@accentColor 를 주지 않으면 OS 강조색 systemColor(accent) 가 섞인다)
@background = @window
@foreground = @text
@selectionBackground = @select
@selectionForeground = @text
# FlatLaf 가 선택색에서 파생시키면 다크는 거의 검정(#0B0D10), 라이트는 짙은 색이 된다 — 직접 지정한다(#63, FR-UI-02)
@selectionInactiveBackground = #22262F
@selectionInactiveForeground = @text
@accentColor = @accent

# ③ 컴포넌트
# UI 글꼴은 논리 글꼴 Dialog(라틴 글꼴 + 한글 대체 글꼴 합성). 한국어 Windows 의 시스템 글꼴(맑은 고딕)은 \ 를 ₩ 로 그려
# Windows 경로가 C:₩work 로 보인다(#125). 크기는 시스템 값을 그대로 쓴다. 터미널은 D2Coding 그대로
defaultFont = Dialog
# 시안 D: 제목 표시줄은 본문과 다른 header 단(FlatLaf 기본 unifiedBackground=true 는 window 색으로 칠한다)
TitlePane.unifiedBackground = false
TitlePane.background = @header
TitlePane.inactiveBackground = @header
Component.borderColor = @border
Separator.foreground = @border
Component.focusColor = @accent
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
Popup.borderCornerRadius = 8
ScrollBar.thumbArc = 999
# 평소 얇게(idle), 마우스를 올리거나 끌면 굵게(thumbInsets) — SoftScrollBarUI(#63)
ScrollBarUI = tanager.ui.theme.SoftScrollBarUI
ScrollBar.thumbInsets = 1,1,1,1
Tanager.scrollBar.idleThumbInsets = 3,3,3,3

# ④ 코드용(ColorToken.key() · 터미널 팔레트)
Tanager.window = @window
Tanager.sidebar = @sidebar
Tanager.term = @term
Tanager.header = @header
Tanager.border = @border
Tanager.text = @text
Tanager.muted = @muted
Tanager.accent = @accent
Tanager.select = @select
Tanager.ok = @ok
Tanager.warn = @warn
Tanager.bad = @bad
Tanager.pane.arc = 6
Tanager.focusBorder.width = 2
# 전환 효과 길이(ms, FR-UI-04 의 150~200ms ease-out). OS 에서 애니메이션을 끄면 0 처럼 즉시 바뀐다
Tanager.motion.duration = 180
Tanager.term.foreground = @termFg
Tanager.term.background = @term
Tanager.term.cursor = @termCursor
Tanager.term.selection = @termSelect
Tanager.term.ansi.0 = @ansi0
Tanager.term.ansi.1 = @ansi1
Tanager.term.ansi.2 = @ansi2
Tanager.term.ansi.3 = @ansi3
Tanager.term.ansi.4 = @ansi4
Tanager.term.ansi.5 = @ansi5
Tanager.term.ansi.6 = @ansi6
Tanager.term.ansi.7 = @ansi7
Tanager.term.ansi.8 = @ansi8
Tanager.term.ansi.9 = @ansi9
Tanager.term.ansi.10 = @ansi10
Tanager.term.ansi.11 = @ansi11
Tanager.term.ansi.12 = @ansi12
Tanager.term.ansi.13 = @ansi13
Tanager.term.ansi.14 = @ansi14
Tanager.term.ansi.15 = @ansi15
