# 라이브러리 버전은 여기서만 정한다. 바꿀 때는 build(deps) 커밋.
[versions]
java = "25"
pty4j = "0.14.0"
jediterm = "3.76"
flatlaf = "3.8"
jackson = "3.3.0"
junit = "6.1.3"
assertj = "3.27.7"
jqwik = "1.10.2"
archunit = "1.5.1"
awaitility = "4.3.0"
spotless = "8.12.0"
palantir-java-format = "2.103.0"

[libraries]
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }
jediterm-core = { module = "org.jetbrains.jediterm:jediterm-core", version.ref = "jediterm" }
jediterm-ui = { module = "org.jetbrains.jediterm:jediterm-ui", version.ref = "jediterm" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# build-logic 이 쓰는 Gradle 플러그인
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
