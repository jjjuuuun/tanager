# git-cliff: Conventional Commits → CHANGELOG
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ BREAKING{% endif %}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->새 기능" },
  { message = "^fix", group = "<!-- 1 -->버그 수정" },
  { message = "^perf", group = "<!-- 2 -->성능" },
  { message = "^refactor", group = "<!-- 3 -->리팩터링" },
  { message = "^docs", group = "<!-- 4 -->문서" },
  { message = "^(build|ci|chore|test)", skip = true },
]
tag_pattern = "v[0-9].*"
